services:
  postgres:
    image: postgres:18-alpine
    pull_policy: always
    container_name: budget-postgres
    environment:
      POSTGRES_DB: budgetapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: budget-app:latest
    pull_policy: never
    container_name: budget-app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/budgetapp
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: budget-app-secret-key-that-is-at-least-256-bits-long-for-hs256
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend/budget-app
      dockerfile: Dockerfile
    image: budget-frontend:latest
    pull_policy: never
    container_name: budget-frontend
    ports:
      - "8083:8083"
    depends_on:
      - app

volumes:
  postgres_data: