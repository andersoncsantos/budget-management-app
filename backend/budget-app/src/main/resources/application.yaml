spring:
  application:
    name: budget-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/budgetapp}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:budget-app-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration: 86400000